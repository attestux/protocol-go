name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler shellcheck
      - name: Check generated files
        # TODO: pin protoc, files can differ on different versions
        run: ./tools/generate.sh --check
      - name: Check Go
        run: ./tools/check-go.sh
      - name: Check shell scripts
        run: shellcheck tools/*.sh
